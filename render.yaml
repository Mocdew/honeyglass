# Render blueprint for Honeyglass.
# Deploy: push this repo to GitHub, then in Render choose "New +" > "Blueprint"
# and point it at the repo. Render injects PORT automatically.
services:
  - type: web
    name: honeyglass
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Set this to your Render URL after the first deploy so the Agent Card
      # advertises the correct public URL (e.g. https://honeyglass.onrender.com).
      - key: PUBLIC_URL
        sync: false
      # Optional: higher GoPlus rate limits. Leave unset for the free tier.
      - key: GOPLUS_ACCESS_TOKEN
        sync: false

      # --- ERC-8183 commerce (OPTIONAL) ---
      # Leave COMMERCE_ENABLED unset to run read-only (no wallet, no on-chain).
      # To become a hireable seller, FIRST fund + register the wallet, upgrade to
      # an always-on plan, and add a persistent disk for deliverables (see README),
      # THEN set these in the dashboard (the key fields are secrets — never commit).
      - key: COMMERCE_ENABLED
        sync: false
      - key: SELLER_PRIVATE_KEY
        sync: false
      - key: SELLER_WALLET_PASSWORD
        sync: false
      - key: SERVICE_PRICE_RAW
        sync: false
      - key: COMMERCE_CATEGORY
        sync: false
      # Point this at the persistent disk mount when commerce is enabled,
      # e.g. /var/data/deliverables (requires a Render disk).
      - key: DELIVERABLE_DIR
        sync: false
